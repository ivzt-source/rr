name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Verify (the bar — pytest + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      # Same gate developers and the agentic loop run locally — one definition
      # of "done" for both. See LOOP.md.
      - name: Run the bar
        run: scripts/verify.sh
